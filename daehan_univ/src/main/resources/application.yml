server:
  port: 8080
spring:
  application:
    name: daehan_univ
  datasource:
    url: jdbc:postgresql://210.178.108.186:25432/daehan_univ
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
