<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />

    <style>

        .main-content {
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            margin-bottom: 20px;

        .card:hover {

            border-radius: 25px;

        }

        }
        .question-card {
            border-left: 4px solid #3498db;
            margin-bottom: 15px;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

            margin-top: 10px;
            padding-left: 20px;
        }
        .option-item {
            padding: 8px 12px;
            margin-bottom: 8px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border-left: 3px solid #ddd;
        }
        .option-item.correct {

        }

            background-color: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: normal;
        }

        .badge-creativity { background-color: #9b59b6; color: white; }
        .badge-leadership { background-color: #e74c3c; color: white; }
        .badge-problem-solving { background-color: #f39c12; color: white; }
        .badge-teamwork { background-color: #27ae60; color: white; }
    </style>
    <style>
        /* 공통 스타일 */
        body {
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;

        /* 헤더 영역 (교직원용 포레스트 그린) */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background-color: #2d4f3a;
            color: white;
            z-index: 1040;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .header-left {
            flex: 1;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .header-center {
            flex: 1;
            text-align: center;
            font-size: 1.2rem;
        }
        .header-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 0.9rem;
            gap: 1rem;
        }

        /* 사용자 정보 및 버튼 */
        .user-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .user-info {
            text-align: right;
            line-height: 1.2;
        }
        .user-btn {
            background: none;

            cursor: pointer;

        .user-btn:hover {
            color: #ffc107;
        }
        .recommendation-card {
            background-color: #f0f8ff;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 4px solid #3498db;
        }
        /* 사이드바 */
        .sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: 100%;
            background-color: #2d4f3a;
            padding: 1rem 0;
            color: white;
            z-index: 1030;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }
        .sidebar-user-info {
            display: none;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-user-info div {
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* 본문 */
        .main-content {
            margin-top: 60px;
            margin-left: 240px;
            padding: 1.5rem;
        }

        /* 메뉴 스타일 */
        .nav-link {
            color: #e0e8f0;
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s, color 0.2s;
            text-decoration: none;
        }
        .nav-link:hover {
            background-color: #3b624d;
            color: #ffffff;
        }
        .nav-link.active {
            background-color: #46775c;
            font-weight: bold;
        }
        .submenu {
            background-color: #3b624d;
        }
        .submenu a {
            padding-left: 2.5rem;
            font-size: 0.95rem;
        }
        .has-submenu::after {
            content: "\25BC";
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        /* 햄버거 메뉴 (모바일) */
        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.25rem;
        }

        /* 반응형 대응 */
        @media (max-width: 768px) {
            .sidebar {
                left: -240px;
                transition: left 0.3s ease;
            }
            .sidebar.show {
                left: 0;
            }
            .main-content {
                margin-left: 0;
            }
            .hamburger {
                display: inline-block;
                margin-right: 1rem;
            }
            .header-right {
                display: none;
            }
            .sidebar-user-info {
                display: block;
            }
        }
    </style>
</head>

<script>

    let allDiagnosisData = [];  // ← 전체 학생 진단 결과 저장용

    // 결과 검색
    function searchResults() {
        const keyword = document.getElementById('searchStudent').value.trim();
        const filtered = allDiagnosisData.filter(d =>
            d.stdNo.includes(keyword) || d.stdNm.includes(keyword)
        );
        renderDiagnosisTable(filtered);  // 필터링된 데이터 렌더링
    }

    // 학생 상세 정보 보기
    function viewStudentDetail(stdNo) {
        fetch(`/api/diagnosis/detail-with-color/${stdNo}`)
            .then(res => res.json())
            .then(data => {
                // 이름, 학과 등도 서버에서 가져오는 경우라면 추가 API 필요
                document.getElementById("studentId").textContent = data.stdNo;
                document.getElementById("studentName").textContent = data.stdName;
                document.getElementById("studentDepartment").textContent = data.departmentName;
                document.getElementById("studentGrade").textContent = data.grade + "학년";
                document.getElementById("studentEmail").textContent = `${data.stdNo}@dhuniv.ac.kr`;

                renderDiagnosisDetail(data.diagnosisDetails);
                renderRadarChart(data.diagnosisDetails);
                renderRecommendedPrograms(data.stdNo);
            });

        document.getElementById('studentDetailSection').style.display = 'block';
        document.getElementById('studentDetailSection').scrollIntoView({ behavior: 'smooth' });
    }

    // 학생 상세 정보 숨기기
    function hideStudentDetail() {
        document.getElementById('studentDetailSection').style.display = 'none';
    }

    // 결과 내보내기
    function exportResults() {
        alert('진단 결과를 엑셀 파일로 내보냅니다.');
        // 실제 구현에서는 서버 API 호출하여 파일 다운로드
    }

    // 결과 출력
    function printStudentReport() {
        alert('학생 진단 결과를 출력합니다.');
        // 실제 구현에서는 인쇄 기능 실행
    }

    // 결과 이메일 발송
    function sendResultEmail() {
        const studentId = document.getElementById('studentId').textContent;
        const studentEmail = document.getElementById('studentEmail').textContent;

        alert(`${studentId} 학생에게 진단 결과를 이메일(${studentEmail})로 발송합니다.`);
        // 실제 구현에서는 서버 API 호출
    }

    document.addEventListener('DOMContentLoaded', function() {
        console.log('진단 결과 열람 페이지가 로드되었습니다.');

        // URL 파라미터에서 학생 ID 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const studentId = urlParams.get('student');

        // 학생 ID가 있으면 상세 정보 표시
        if (studentId) {
            viewStudentDetail(studentId);
        }
    });


    document.addEventListener("DOMContentLoaded", function () {
        fetch('/api/diagnosis/recent')
            .then(res => res.json())
            .then(
                data => {
                    allDiagnosisData = data;
                    renderDiagnosisTable(data)});
    });

    function renderDiagnosisTable(data) {
        const tbody = document.querySelector("tbody");
        tbody.innerHTML = "";

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted">검색 결과가 없습니다.</td></tr>`;
            return;
        }

        data.forEach(student => {
            const color = getColorByScore(student.averageScore);
            const row = `
            <tr>
                <td>${student.stdNo}</td>
                <td>${student.stdNm}</td>
                <td>${student.deptName}</td>
                <td>${student.grade}학년</td>
                <td>${student.diagnosisDate}</td>
                <td>
                    <div class="d-flex align-items-center">
                        <div class="progress flex-grow-1 me-2" style="height: 8px;">
                            <div class="progress-bar" style="width: ${student.averageScore}%; background-color: ${color};"></div>
                        </div>
                        <span>${student.averageScore}점</span>
                    </div>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="viewStudentDetail('${student.stdNo}')">
                        <i class="fas fa-eye">보기</i>
                    </button>
                </td>
            </tr>
        `;
            tbody.insertAdjacentHTML("beforeend", row);
        });
    }


    function getColorByScore(score) {
        if (score >= 80) return '#198754';
        if (score >= 60) return '#0d6efd';
        if (score >= 40) return '#ffc107';
        return '#dc3545';
    }
    function renderDiagnosisDetail(data) {
        const container = document.getElementById("resultSummary");
        if (!data || data.length === 0) {
            container.innerHTML = "<p class='text-muted'>데이터 없음</p>";
            return;
        }

        container.innerHTML = `
        <h5 class="mb-3">역량별 점수</h5>` +
            data.map(item => `
            <div class="mb-3">
                <div class="d-flex justify-content-between">
                    <strong>${item.competencyName}</strong>
                    <span class="fw-bold">${item.score}점</span>
                </div>
                <div class="progress" style="height: 8px;">
                    <div class="progress-bar" role="progressbar"
                         style="width: ${item.score}%; background-color: ${item.colorHex};"
                         aria-valuenow="${item.score}" aria-valuemin="0" aria-valuemax="100"></div>
                </div>
            </div>
        `).join('');
    }

    let radarChart = null;

    function renderRadarChart(data) {
        const ctx = document.getElementById('competencyRadarChart');
        const labels = data.map(item => item.competencyName);
        const scores = data.map(item => item.score);
        const colors = data.map(item => item.colorHex);

        if (radarChart !== null) {
            radarChart.destroy();
        }

        radarChart = new Chart(ctx, {
            type: 'radar',
            data: {
                labels: labels,
                datasets: [{
                    label: '역량 점수',
                    data: scores,
                    backgroundColor: 'rgba(153, 102, 255, 0.2)',
                    borderColor: '#9966ff',
                    borderWidth: 2,
                    pointBackgroundColor: colors,
                    pointBorderColor: "#fff",
                    pointHoverBackgroundColor: "#fff",
                    pointHoverBorderColor: colors
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true, position: 'top' }
                },
                scales: {
                    r: {
                        min: 0,
                        max: 250,
                        ticks: {
                            stepSize: 20
                        },
                        pointLabels: {
                            font: { size: 14 }
                        }
                    }
                }
            }
        });
    }
    function renderRecommendedPrograms(stdNo) {
        fetch(`/api/diagnosis/recommend/${stdNo}`)
            .then(res => res.json())
            .then(programs => {
                const container = document.getElementById('recommendationSection');
                if (!programs || programs.length === 0) {
                    container.innerHTML = '<p class="text-muted">추천할 비교과 프로그램이 없습니다.</p>';
                    return;
                }

                container.innerHTML = programs.map(prg => `
                <div class="recommendation-card">
                    <div class="d-flex justify-content-between align-items-start">
                        <div>
                            <h6 class="mb-1">${prg.prgNm}</h6>
                            <p class="mb-1 text-muted">${prg.prgDesc}</p>
                            <p class="mb-0 small">
                                <span class="badge bg-info me-2">${prg.categoryName}</span>
                                <span class="badge bg-secondary me-2">${formatDate(prg.aplyEndDate)} 마감</span>
                            </p>
                        </div>
                        <a href="#" class="btn btn-sm btn-outline-primary">상세보기</a>
                    </div>
                </div>
            `).join('');
            })
            .catch(err => {
                console.error("❌ 추천 프로그램 조회 실패:", err);
                document.getElementById('recommendationSection').innerHTML =
                    '<p class="text-danger">추천 프로그램을 불러오지 못했습니다.</p>';
            });
    }

    // 날짜 포맷 YYYY-MM-DD
    function formatDate(dateStr) {
        const date = new Date(dateStr);
        return date.toISOString().split('T')[0];
    }
</script>

<script>

        document.getElementById('qstCodeHidden').value = '';
        document.getElementById('qstCodeDisplay').innerText = '';
        document.getElementById('questionText').value = '';

        clearSubCompetencyOptions();
        loadLikertOptions();

        new bootstrap.Modal(document.getElementById('addQuestionModal')).show();

    function handleSaveOrUpdate() {
        const qstId = document.getElementById('qstIdHidden').value;
        if (qstId) {
            saveOrUpdateQuestion(true, qstId);  // 수정
        } else {
            saveOrUpdateQuestion(false, null);  // 등록
        }
    }
    // ✅ 문항 저장 (문항 + 선택지)
    function saveOrUpdateQuestion(isUpdate = false, qstId = null) {
        const payload = {
            qstCode: document.getElementById('qstCodeHidden').value,
            questionText: document.getElementById('questionText').value,
            qstOrd: 1,
            coreCptInfoId: Number(document.getElementById('subCompetency').value),
            regUserId: 'admin',
            optionTemplateId: 1,
            options: []
        };

        document.querySelectorAll('#optionsContainer .option-input').forEach((opt) => {
            payload.options.push({
                text: opt.querySelector('input[type=text]').value,
                score: parseInt(opt.querySelector('input[type=number]').value),
                isCorrect: false
            });
        });

        const method = isUpdate ? 'PUT' : 'POST';
        const url = isUpdate ? `/api/questions/${qstId}` : '/api/questions';

        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(res => {
            if (res.ok) {
                alert(isUpdate ? '문항이 수정되었습니다.' : '문항이 저장되었습니다.');
                location.reload();
            } else {
                alert(isUpdate ? '문항 수정 실패' : '문항 저장 실패');
            }
        });
    }


    /**
     * ✅ 선택된 하위 역량에 대한 문항 코드 생성 요청
     */
    function loadNextQstCode() {
        const subCptId = document.getElementById('subCompetency').value;
        if (!subCptId) {
            alert('하위 역량을 선택해주세요.');
            return;
        }

        fetch(`/api/questions/next-code?subCptId=${subCptId}`)
            .then(res => res.text())
            .then(code => {
                console.log("생성된 코드: ", code);
                document.getElementById('qstCodeDisplay').innerText = code; // 코드 표시용 요소
                // 필요시 hidden input에 저장
                document.getElementById('qstCodeHidden').value = code;
            })
            .catch(() => alert("문항 코드 생성 실패"));
    }
    /**
     * ✅ 문항 삭제
     * @param {number} qstId 삭제할 문항 ID
     */
    function deleteQuestion(qstId) {
        if (!confirm("⚠️ 해당 문항을 삭제하면 이 문항에 답변한 학생들의 기록도 함께 삭제됩니다. 정말 삭제하시겠습니까?\"")) return;

        fetch(`/api/questions/${qstId}`, {
            method: 'DELETE'
        }).then(res => {
            if (res.ok) {
                alert("삭제되었습니다.");
                loadQuestions(); // 목록 새로고침
            } else {
                alert("삭제 실패");
            }
        });
    }
    /**
     * ✅ 문항 수정 모달 열기 (기본은 fetch 로 데이터를 가져온 후 모달에 세팅)
     * @param {number} qstId 수정할 문항 ID
     */
    function editQuestion(qstId) {
        fetch(`/api/questions/${qstId}`)
            .then(res => res.json())
            .then(data => {
                // 값 세팅
                document.getElementById('qstIdHidden').value = data.qstId;  // ✅ qstId 저장
                document.getElementById('competency').value = data.topCompetencyId;
                loadSubCompetencies(data.topCompetencyId);

                setTimeout(() => {
                    document.getElementById('subCompetency').value = data.subCompetencyId;
                }, 300);

                document.getElementById('questionText').value = data.questionText;
                document.getElementById('qstCodeDisplay').innerText = data.qstCode;
                document.getElementById('qstCodeHidden').value = data.qstCode;

                // 선택지 세팅 필요 시 작성
            });

        new bootstrap.Modal(document.getElementById('addQuestionModal')).show();
    }


    /**------------------------------------------- 1단계 — 진단 문항 목록 API 연동 → 화면에 DB 문항 출력------------------------
     * */
    // ✅ 문항 목록 조회 및 렌더링
    function loadQuestions() {
        fetch('/api/questions')
            .then(res => res.json())
            .then(data => {
                renderQuestionList(data);
            })
            .catch(err => {
                console.error('문항 목록 조회 실패:', err);
                alert('문항 목록 조회에 실패했습니다.');
            });
    }
    /**
     * ✅ 문항 목록을 화면에 출력 (questionList 만 비웁니다)
     * @param {Array} questions 서버에서 받은 문항 리스트
     */
    /**
     * ✅ 문항 목록을 화면에 출력 (questionList 만 비웁니다)
     * @param {Array} questions 서버에서 받은 문항 리스트

     function renderQuestionList(questions) {
     const listEl = document.getElementById('questionList');
     listEl.innerHTML = '';  // pagination 영역과 분리하여 초기화

     if (!questions || questions.length === 0) {
     listEl.innerHTML = '<p class="text-muted">등록된 문항이 없습니다.</p>';
     return;
     }

     questions.forEach((q, idx) => {
     listEl.innerHTML += `
     <div class="question-card">
     <div class="d-flex justify-content-between align-items-start mb-2">
     <div>
     <span class="badge badge-competency me-2" style="background-color:${q.colorHex}; color:#fff;">
     ${q.cciNm}
     </span>
     <span class="badge bg-secondary me-2">${q.subCompetencyName}</span>
     <span class="badge bg-info">${q.qstCode}</span>
     </div>
     <div>
     <button class="btn btn-sm btn-outline-primary me-1" onclick="editQuestion(${q.qstId})">
     <i class="fas fa-edit"></i>
     </button>
     <button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion(${q.qstId})">
     <i class="fas fa-trash"></i>
     </button>
     </div>
     </div>
     <h6 class="mb-2">Q${idx+1}. ${q.questionText}</h6>
     <div class="question-options">
     ${renderOptions()}
     </div>
     <div class="mt-2 text-muted small">
     <span class="me-3">문항 코드: ${q.qstCode}</span>
     <span class="badge bg-success">활성</span>
     </div>
     </div>
     `;
     });
     }
     */
    // ✅ 리커트 척도 옵션 HTML
    function renderOptions() {
        return `
        <div class="option-item"><input type="radio" disabled> 전혀 그렇지 않다 (1점)</div>
        <div class="option-item"><input type="radio" disabled> 그렇지 않다 (2점)</div>
        <div class="option-item"><input type="radio" disabled> 보통이다 (3점)</div>
        <div class="option-item"><input type="radio" disabled> 그렇다 (4점)</div>
        <div class="option-item"><input type="radio" disabled> 매우 그렇다 (5점)</div>
    `;
    }
    /**------------------------------------------- 1단계 — 진단 문항 목록 API 연동 → 화면에 DB 문항 출력------------------------
     * */

    /**
     * 상/하위 역량 불러오는 js 파트
     * */
    /**
     * ✅ 역량 영역 드롭다운 로딩 (상위 역량)
     */
    function loadTopCompetencies() {
        fetch('/api/competencies/list')
            .then(res => res.json())
            .then(topList => {
                console.log('상위 역량 목록:', topList);
                renderTopCompetencyOptions(topList);
            });
    }

    /**
     * ✅ 상위 역량 옵션 렌더링
     * @param topList 상위 역량 데이터 배열
     */
    function renderTopCompetencyOptions(topList) {
        const topSelects = [
            document.getElementById('competencyFilter'),
            document.getElementById('competency')
        ];

        // 각 select 초기화
        topSelects.forEach(sel => {
            if (sel.id.includes('Filter')) {
                sel.innerHTML = '<option value="">전체</option>';
            } else {
                sel.innerHTML = '<option value="">선택하세요</option>';
            }
        });

        // 상위 역량 삽입
        topList.forEach(top => {
            topSelects.forEach(sel => {
                sel.innerHTML += `<option value="${top.cciId}">${top.cciNm}</option>`;
            });
        });
    }

    /**
     * ✅ 상위 역량 선택 시 하위 역량 로딩
     * @param cciId 상위 역량 ID
     */
    function loadSubCompetencies(cciId) {
        if (!cciId) {
            clearSubCompetencyOptions();
            return;
        }

        fetch(`/api/competencies/${cciId}`)
            .then(res => res.json())
            .then(detail => {
                console.log(`상위 역량 ${cciId} 상세:`, detail);
                renderSubCompetencyOptions(detail.children);
            });
    }

    /**
     * ✅ 하위 역량 옵션 렌더링
     * @param children 하위 역량 배열
     */
    function renderSubCompetencyOptions(children) {
        const subSelects = [
            document.getElementById('subCompetencyFilter'),
            document.getElementById('subCompetency')
        ];

        subSelects.forEach(sel => {
            if (sel.id.includes('Filter')) {
                sel.innerHTML = '<option value="">전체</option>';
            } else {
                sel.innerHTML = '<option value="">선택하세요</option>';
            }
        });

        children.forEach(sub => {
            subSelects.forEach(sel => {
                sel.innerHTML += `<option value="${sub.cciId}">${sub.cciNm}</option>`;
            });
        });
    }

    /**
     * ✅ 하위 역량 select 초기화
     */
    function clearSubCompetencyOptions() {
        const subSelects = [
            document.getElementById('subCompetencyFilter'),
            document.getElementById('subCompetency')
        ];

        subSelects.forEach(sel => {
            if (sel.id.includes('Filter')) {
                sel.innerHTML = '<option value="">전체</option>';
            } else {
                sel.innerHTML = '<option value="">선택하세요</option>';
            }
        });
    }

    /**
     * ✅ 상위 역량 select change 이벤트 바인딩
     */
    function bindTopCompetencyChange() {
        const topSelects = [
            document.getElementById('competencyFilter'),
            document.getElementById('competency')
        ];

        topSelects.forEach(sel => {
            sel.addEventListener('change', (e) => {
                const cciId = e.target.value;
                loadSubCompetencies(cciId);
            });
        });
    }

    // ✅ 페이지 로드 시
    document.addEventListener('DOMContentLoaded', () => {
        loadTopCompetencies();      // 상위 역량 불러오기
        bindTopCompetencyChange();  // change 이벤트 연결
        //loadQuestions(); // ✅ DOM 로드 시 목록 불러오기
        searchQuestions(0);         // 페이지 0부터 조건 없이 페이징 목록 불러오기
        document.getElementById('subCompetency').addEventListener('change', loadNextQstCode);
    });
    /**
     * 상/하위 역량 불러오는 js 파트
     * */

    // 문항 추가 모달이 열릴 때 선택지 로드
    document.getElementById('addQuestionModal').addEventListener('show.bs.modal', function () {
        loadLikertOptions();
    });

    /**
     * ✅ DB에서 리커트 척도 선택지를 로드하여 모달에 렌더링
     */
    function loadLikertOptions() {
        fetch('/api/options/likert')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('optionsContainer');
                container.innerHTML = ''; // 기존 내용 제거

                data.forEach(opt => {
                    container.innerHTML += `
                    <div class="option-input mb-2">
                        <div class="input-group">
                            <span class="input-group-text">${opt.ord}</span>
                            <input type="text" class="form-control" value="${opt.optionText}" readonly>
                            <span class="input-group-text">점수</span>
                            <input type="number" class="form-control" value="${opt.score}" readonly style="width: 70px;">
                        </div>
                    </div>
                `;
                });
            })
            .catch(() => {
                alert('리커트 척도 선택지 로드에 실패했습니다.');
            });
    }
    /**
     * 필터링 관련 js
     * */

    /**
     * ✅ 문항 조회 + 렌더링
     */
    function searchQuestions(pageNo = 0) {
        const topCptId = document.getElementById('competencyFilter').value;
        const subCptId = document.getElementById('subCompetencyFilter').value;
        const keyword = document.getElementById('searchQuestion').value;

        const params = new URLSearchParams();
        params.append('page', pageNo);
        params.append('size', 10);
        if (topCptId) params.append('topCptId', topCptId);
        if (subCptId) params.append('subCptId', subCptId);
        if (keyword) params.append('keyword', keyword);

        fetch(`/api/questions/filter?${params.toString()}`)
            .then(res => {
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return res.json();
            })
            .then(data => {
                renderQuestionList(data.content);
                renderPagination(data);
            })
            .catch(err => {
                console.error('문항 조회 실패:', err);
                alert('문항 조회 실패: ' + err.message);
            });
    }


    // 초기 로드 시 바로 0페이지부터 조회
    document.addEventListener('DOMContentLoaded', () => {
        loadTopCompetencies();
        bindTopCompetencyChange();
        searchQuestions(0);
    });

    /**
     * ✅ 문항 목록 출력
     */
    function renderQuestionList(questions) {
        const listEl = document.getElementById('questionList');
        listEl.innerHTML = '';

        if (!questions || questions.length === 0) {
            listEl.innerHTML = '<p class="text-muted">등록된 문항이 없습니다.</p>';
            return;
        }

        questions.forEach((q, idx) => {
            listEl.innerHTML += `
        <div class="question-card position-relative">
            <!-- 우측 상단 수정/삭제 버튼 -->
            <div class="position-absolute top-0 end-0 mt-2 me-2">
                <button class="btn btn-sm btn-outline-primary me-1" onclick="editQuestion(${q.qstId})" title="수정">
                    <i class="fas fa-edit">수정</i>
                </button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteQuestion(${q.qstId})" title="삭제">
                    <i class="fas fa-trash">삭제</i>
                </button>
            </div>

            <!-- 문항 정보 -->
            <span class="badge badge-competency me-2" style="background-color:${q.colorHex}; color:#fff;">
                ${q.competencyName}
            </span>
            <span class="badge bg-secondary">${q.subCompetencyName}</span>
            <span class="badge bg-info">${q.qstCode}</span>
            <h6>Q${idx + 1}. ${q.questionText}</h6>
        </div>
        `;
        });
    }



    /**
     * 필터링 관련 js 끝
     * */

    /**
     * 페이징 관련 js 시작
     * */
    /**
     * ✅ 특정 페이지 로드
     * @param {number} pageNo 페이지 번호
     */
    function loadPage(pageNo) {
        fetch(`/api/questions?page=${pageNo}`)
            .then(res => res.json())
            .then(data => {
                renderQuestionList(data.questions); // 목록 렌더링
                renderPagination(data.pageInfo);    // 페이지네이션 렌더링
            });
    }

    /**
     * ✅ 페이징 렌더링
     */
    function renderPagination(page) {
        const paginationEl = document.getElementById('pagination');
        if (!paginationEl) {
            console.warn('.pagination 요소를 찾을 수 없습니다.');
            return;
        }

        paginationEl.innerHTML = '';
        for (let i = 0; i < page.totalPages; i++) {
            paginationEl.innerHTML += `
          <li class="page-item ${page.number === i ? 'active' : ''}">
            <a class="page-link" href="#" onclick="searchQuestions(${i})">${i + 1}</a>
          </li>
        `;
        }
    }



    /**
     * 페이징 관련 js 끝
     * */

</script>
</script>
<script>
    const sidebar = document.getElementById("sidebar");
    const hamburger = document.getElementById("hamburger");
    hamburger.addEventListener("click", () => {
        sidebar.classList.toggle("show");
    });

    const menuLinks = document.querySelectorAll("[data-menu]");
    menuLinks.forEach((menu) => {
        menu.addEventListener("click", (e) => {
            e.preventDefault();
            const key = menu.getAttribute("data-menu");
            const submenu = document.getElementById(`submenu-${key}`);

            document.querySelectorAll(".submenu").forEach((sm) => {
                if (sm !== submenu) sm.style.display = "none";
            });

            if (submenu) {
                submenu.style.display =
                    submenu.style.display === "block" ? "none" : "block";
            }
        });
    });
</script>
<script src="/js/layout/e_header.js"></script>
</body>
</html>
