<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대한대학교 CMS 포털 - 교직원</title>
    <!-- Bootstrap & Icons -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
            rel="stylesheet"
    />
    <style>
        /* 공통 스타일 */
        body {
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", sans-serif;
        }

        /* 헤더 영역 (교직원용 포레스트 그린) */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 60px;
            background-color: #2d4f3a;
            color: white;
            z-index: 1040;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .header-left {
            flex: 1;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .header-center {
            flex: 1;
            text-align: center;
            font-size: 1.2rem;
        }
        .header-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-size: 0.9rem;
            gap: 1rem;
        }

        /* 사용자 정보 및 버튼 */
        .user-box {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .user-info {
            text-align: right;
            line-height: 1.2;
        }
        .user-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.2rem;
            padding: 0.25rem 0.5rem;
            cursor: pointer;
        }
        .user-btn:hover {
            color: #ffc107;
        }

        /* 사이드바 */
        .sidebar {
            position: fixed;
            top: 60px;
            left: 0;
            width: 240px;
            height: 100%;
            background-color: #2d4f3a;
            padding: 1rem 0;
            color: white;
            z-index: 1030;
            overflow-y: auto;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        }
        .sidebar-user-info {
            display: none;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .sidebar-user-info div {
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* 본문 */
        .main-content {
            margin-top: 60px;
            margin-left: 240px;
            padding: 1.5rem;
        }

        /* 메뉴 스타일 */
        .nav-link {
            color: #e0e8f0;
            padding: 0.75rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s, color 0.2s;
            text-decoration: none;
        }
        .nav-link:hover {
            background-color: #3b624d;
            color: #ffffff;
        }
        .nav-link.active {
            background-color: #46775c;
            font-weight: bold;
        }
        .submenu {
            background-color: #3b624d;
        }
        .submenu a {
            padding-left: 2.5rem;
            font-size: 0.95rem;
        }
        .has-submenu::after {
            content: "\25BC";
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        /* 햄버거 메뉴 (모바일) */
        .hamburger {
            display: none;
            cursor: pointer;
            font-size: 1.25rem;
        }

        /* 반응형 대응 */
        @media (max-width: 768px) {
            .sidebar {
                left: -240px;
                transition: left 0.3s ease;
            }
            .sidebar.show {
                left: 0;
            }
            .main-content {
                margin-left: 0;
            }
            .hamburger {
                display: inline-block;
                margin-right: 1rem;
            }
            .header-right {
                display: none;
            }
            .sidebar-user-info {
                display: block;
            }
        }
        .text-center {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .text-center #radarAvgChart {
            height: 500px !important;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<!-- 헤더 -->
<div th:replace="~{layout/e_header :: e_header}"></div>

<!-- 사이드바 -->
<div th:replace="~{layout/e_sidebar :: e_sidebar}"></div>

<!-- 본문 -->
<main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">
            <i class="fas fa-chart-line me-2"></i>
            역량진단 관리
        </h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <div class="btn-group me-2">
                <a href="/employees/core-empl-cpt" class="btn btn-outline-primary">
                    <i class="fas fa-cogs me-2"></i>
                    역량 항목 관리
                </a>
                <a href="/employees/question-management" class="btn btn-outline-primary">
                    <i class="fas fa-question-circle me-2"></i>
                    진단 문항 관리
                </a>
                <a href="/employees/core-diagnosis-result" class="btn btn-outline-primary">
                    <i class="fas fa-chart-bar me-2"></i>
                    진단 결과 열람
                </a>
            </div>
        </div>
    </div>

    <!-- 통계 카드 -->
    <div class="row mb-4">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title text-primary">전체 진단 수</h5>
                    <h2 id="totalEvalCount"  class="text-primary">1,247</h2>
                    <small class="text-muted" id="recentGrowth"></small>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title text-success">평균 점수</h5>
                    <h2 id="averageScore" class="text-success">72.5</h2>

                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title text-warning">진단 문항</h5>
                    <h2 id="questionCount" class="text-warning">45</h2>
                    <!--                                <small class="text-muted">5개 역량 영역</small>-->
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <h5 class="card-title text-info">미완료 학생</h5>
                    <h2 id="incompleteStudentCount" class="text-info">324</h2>
                    <small  id="incompleteRate" class="text-muted"></small>
                </div>
            </div>
        </div>
    </div>

    <!-- 역량별 현황 -->
    <div class="card">
        <div class="card-header">
            <h5 class="mb-0">
                <i class="fas fa-chart-pie me-2"></i>
                역량별 진단 현황
            </h5>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-8">
                    <div class="chart-container">
                        <!-- 역량별 평균 점수 차트 영역 -->
                        <div class="text-center">
                            <!--<div class="alert alert-info">
                                <i class="fas fa-info-circle me-2"></i>

                            </div>-->

                            <!-- ✅ 차트를 그릴 캔버스 -->
                            <canvas id="radarAvgChart" width="400" height="300"></canvas>
                        </div>
                    </div>
                </div>

                <!-- ✅ 여기만 유지하고 안의 카드들은 삭제 -->
                <div class="col-md-4" id="competencyBarContainer">
                    <!-- JS가 여기다 렌더링함 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 최근 진단 결과 -->
    <div class="card mt-4">
        <div class="card-header">
            <h5 class="mb-0">
                <i class="fas fa-history me-2"></i>
                최근 진단 결과
            </h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table id="recentDiagnosisTable" class="table table-hover">
                    <thead> <tr>
                        <th>학번</th>
                        <th>이름</th>
                        <th>학과</th>
                        <th>학년</th>
                        <th>진단일시</th>
                        <th>종합점수</th>
                        <th>상세보기</th>
                    </tr></thead>
                    <tbody></tbody> <!-- 여기에 JS로 추가됨 -->
                </table>
            </div>
            <div class="text-center mt-3">
                <a href="/employees/core-diagnosis-result" class="btn btn-outline-primary">
                    <i class="fas fa-list me-2"></i>
                    전체 결과 보기
                </a>
            </div>
        </div>
    </div>

    <!-- 진단 관리 바로가기 -->
    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <i class="fas fa-cogs text-primary" style="font-size: 3rem;"></i>
                    <h5 class="mt-3 mb-3">역량 항목 관리</h5>
                    <p class="text-muted mb-3">역량 항목을 추가, 수정, 삭제합니다</p>
                    <a href="/employees/core-empl-cpt" class="btn btn-primary">
                        <i class="fas fa-arrow-right me-1"></i>
                        바로가기
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <i class="fas fa-question-circle text-success" style="font-size: 3rem;"></i>
                    <h5 class="mt-3 mb-3">진단 문항 관리</h5>
                    <p class="text-muted mb-3">진단 문항을 추가, 수정, 삭제합니다</p>
                    <a href="/employees/question-management" class="btn btn-success">
                        <i class="fas fa-arrow-right me-1"></i>
                        바로가기
                    </a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <i class="fas fa-chart-bar text-warning" style="font-size: 3rem;"></i>
                    <h5 class="mt-3 mb-3">진단 결과 열람</h5>
                    <p class="text-muted mb-3">학생들의 진단 결과를 확인합니다</p>
                    <a href="/employees/core-diagnosis-result" class="btn btn-warning">
                        <i class="fas fa-arrow-right me-1"></i>
                        바로가기
                    </a>
                </div>
            </div>
        </div>
    </div>
    <!-- 🧩 상세보기 모달 -->
    <div class="modal fade" id="diagnosisDetailModal" tabindex="-1" aria-labelledby="diagnosisDetailLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="diagnosisDetailLabel">진단 상세 결과</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-bordered">
                        <thead class="table-light">
                        <tr>
                            <th>역량명</th>
                            <th>점수</th>
                            <th>진단일시</th>
                        </tr>
                        </thead>
                        <tbody id="diagnosisDetailTableBody">
                        <!-- JS로 렌더링됨 -->
                        </tbody>
                    </table>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>
</main>
<!-- Chart.js CDN 삽입 (가급적 <body> 하단 또는 <head>에서) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    let CURRENT_USER_ID = null;

    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const res = await fetch('/api/user/me/employee');
            if (!res.ok) throw new Error('인증되지 않은 사용자');
            const user = await res.json();
            CURRENT_USER_ID = user.userId;
            console.log("✅ 로그인 교직원:", user.emplNm);
        } catch (err) {
            alert("로그인이 필요합니다.");
            location.href = "/login";
        }
    });
    document.addEventListener('DOMContentLoaded', function () {
        // 페이지 로드시 API 호출
        fetch('/api/diagnosis/dashboard-summary')
            .then(response => {
                if (!response.ok) {
                    throw new Error('요약 통계 조회 실패');
                }
                return response.json();
            })
            .then(data => {
                // 응답 데이터 구조:
                // { totalEvalCount, averageScore, questionCount, incompleteStudentCount }

                // HTML 요소에 값 삽입
                document.getElementById('totalEvalCount').textContent = data.totalEvalCount.toLocaleString();
                document.getElementById('averageScore').textContent = data.averageScore.toFixed(1);
                document.getElementById('questionCount').textContent = data.questionCount;
                document.getElementById('incompleteStudentCount').textContent = data.incompleteStudentCount;

                // 보조 텍스트 예시: 최근 증가량, 미완료 비율 등 (여기선 예시용 하드코딩)
                // document.getElementById('recentGrowth').textContent = "+156";

                // 전체의 몇 %인지 간단 계산 (예시: 전체 학생 수 1247명 중 324명)
                //const incompleteRate = (data.incompleteStudentCount / data.totalEvalCount) * 100;
                //document.getElementById('incompleteRate').textContent = isNaN(incompleteRate) ? "-" : incompleteRate.toFixed(1);
            })
            .catch(error => {
                console.error('❌ 대시보드 요약 데이터 로딩 실패:', error);
            });
    });

    document.addEventListener('DOMContentLoaded', function () {
        fetch('/api/diagnosis/competency-avg')
            .then(res => res.json())
            .then(data => {
                if (!Array.isArray(data)) return;

                // ✅ 데이터 분해
                const labels = data.map(item => item.upperCciName);
                const scores = data.map(item => item.avgScore);
                const colors = data.map(item => item.colorHex || '#999');

                // ✅ 레이더 차트 렌더링
                const ctx = document.getElementById('radarAvgChart').getContext('2d');
                new Chart(ctx, {
                    type: 'radar',

                    data: {
                        labels: labels,
                        datasets: [{
                            label: '역량 평균 점수',
                            data: scores,
                            backgroundColor: 'rgba(54, 162, 235, 0.2)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            pointBackgroundColor: colors,
                            pointBorderColor: '#fff',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            r: {
                                angleLines: { display: true },
                                suggestedMin: 0,
                                suggestedMax: 100,
                                ticks: { stepSize: 20 }
                            }
                        },
                        plugins: {
                            legend: {
                                display: true,
                                position: 'top'
                            }
                        }
                    }
                });

                // ✅ 우측 바 시각화 추가 호출
                renderCompetencyAverageBars(data);
            })
            .catch(err => {
                console.error('❌ 역량 평균 점수 불러오기 실패:', err);
            });
    });


    function renderCompetencyAverageBars(data) {
        const container = document.getElementById('competencyBarContainer');
        if (!container) return;

        container.innerHTML = '';

        data.forEach(item => {
            const wrapper = document.createElement('div');
            wrapper.className = 'competency-card p-3 mb-3';

            wrapper.style.borderLeft = `6px solid ${item.colorHex}`; // ✅ 왼쪽 바 색상 적용

            wrapper.innerHTML = `
            <div class="d-flex justify-content-between">
                <h6>${item.upperCciName}</h6>
                <span class="fw-bold">${item.avgScore}점</span>
            </div>
            <div class="progress mt-2" style="height: 8px;">
                <div class="progress-bar"
                     style="width: ${item.avgScore}%; background-color: ${item.colorHex};">
                </div>
            </div>
        `;

            container.appendChild(wrapper);
        });
    }

    document.addEventListener('DOMContentLoaded', function () {
        fetch('/api/diagnosis/recent') // ✅ 최근 진단 결과 API
            .then(response => response.json())
            .then(data => renderRecentDiagnosisTable(data))
            .catch(error => {
                console.error('❌ 최근 진단 결과 불러오기 실패:', error);
            });
    });

    function renderRecentDiagnosisTable(data) {
        const tbody = document.querySelector('#recentDiagnosisTable tbody');
        if (!tbody || !Array.isArray(data)) return;

        tbody.innerHTML = ''; // 기존 내용 제거

        data.forEach(item => {
            const tr = document.createElement('tr');

            tr.innerHTML = `
            <td>${item.stdNo}</td>
            <td>${item.stdNm}</td>
            <td>${item.deptName || '-'}</td>
            <td>${item.grade || '-'}</td>
            <td>${item.diagnosisDate || '-'}</td>
            <td>
                <div class="d-flex align-items-center">
                    <div class="progress flex-grow-1 me-2" style="height: 8px;">
                        <div class="progress-bar" style="width: ${item.averageScore}%; background-color: ${getColorByScore(item.averageScore)};"></div>
                    </div>
                    <span>${item.averageScore}점</span>
                </div>
            </td>
            <td>
                <button class="btn btn-sm btn-outline-primary" onclick="viewDiagnosisDetail('${item.stdNo}')">
                    <i class="fas fa-eye">보기</i>
                </button>
            </td>
        `;
            tbody.appendChild(tr);
        });
    }

    // ✅ 점수대에 따라 색상 반환
    function getColorByScore(score) {
        if (score >= 80) return '#198754';     // green
        if (score >= 60) return '#0d6efd';     // blue
        if (score >= 40) return '#ffc107';     // yellow
        return '#dc3545';                      // red
    }

    // ✅ 상세보기 이동
    function viewDiagnosisDetail(stdNo) {
        fetch(`/api/diagnosis/detail/${stdNo}`)
            .then(response => response.json())
            .then(data => {
                const tbody = document.getElementById('diagnosisDetailTableBody');
                tbody.innerHTML = '';

                data.forEach(item => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
          <td>${item.upperCciName}</td>
          <td>${item.score}점</td>
          <td>${item.answeredAt}</td>
        `;
                    tbody.appendChild(tr);
                });

                const modal = new bootstrap.Modal(document.getElementById('diagnosisDetailModal'));
                modal.show();
            })
            .catch(err => {
                console.error('❌ 상세 결과 불러오기 실패:', err);
                alert('진단 결과를 불러오는 데 실패했습니다.');
            });
    }

</script>
<!-- 스크립트 -->
<script>
    const sidebar = document.getElementById("sidebar");
    const hamburger = document.getElementById("hamburger");
    hamburger.addEventListener("click", () => {
        sidebar.classList.toggle("show");
    });

    const menuLinks = document.querySelectorAll("[data-menu]");
    menuLinks.forEach((menu) => {
        menu.addEventListener("click", (e) => {
            e.preventDefault();
            const key = menu.getAttribute("data-menu");
            const submenu = document.getElementById(`submenu-${key}`);

            document.querySelectorAll(".submenu").forEach((sm) => {
                if (sm !== submenu) sm.style.display = "none";
            });

            if (submenu) {
                submenu.style.display =
                    submenu.style.display === "block" ? "none" : "block";
            }
        });
    });
</script>
<script src="/js/layout/e_header.js"></script>
</body>
</html>
