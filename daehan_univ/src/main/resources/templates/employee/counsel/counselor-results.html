<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대한대학교 CMS 포털 - 상담 결과 관리</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link th:href="@{/css/counsel.css}" rel="stylesheet" />
    
    <style>
      /* 공통 스타일 */
      body {
        background-color: #fafafa;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
      }

      /* 헤더 영역 (교직원용 포레스트 그린) */
      .header {
        position: fixed;
        top: 0;
        width: 100%;
        height: 60px;
        background-color: #2d4f3a;
        color: white;
        z-index: 1040;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .header-left {
        flex: 1;
        font-weight: bold;
        font-size: 1.1rem;
      }
      .header-center {
        flex: 1;
        text-align: center;
        font-size: 1.2rem;
      }
      .header-right {
        flex: 1;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        font-size: 0.9rem;
        gap: 1rem;
      }

      /* 사용자 정보 및 버튼 */
      .user-box {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .user-info {
        text-align: right;
        line-height: 1.2;
      }
      .user-btn {
        background: none;
        border: none;
        color: white;
        font-size: 1.2rem;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
      }
      .user-btn:hover {
        color: #ffc107;
      }

      /* 사이드바 */
      .sidebar {
        position: fixed;
        top: 60px;
        left: 0;
        width: 240px;
        height: 100%;
        background-color: #2d4f3a;
        padding: 1rem 0;
        color: white;
        z-index: 1030;
        overflow-y: auto;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      }
      .sidebar-user-info {
        display: none;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .sidebar-user-info div {
        font-size: 0.95rem;
        line-height: 1.4;
      }

      /* 본문 */
      .main-content {
        margin-top: 60px;
        margin-left: 240px;
        padding: 1.5rem;
      }

      /* 메뉴 스타일 */
      .nav-link {
        color: #e0e8f0;
        padding: 0.75rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background-color 0.2s, color 0.2s;
        text-decoration: none;
      }
      .nav-link:hover {
        background-color: #3b624d;
        color: #ffffff;
      }
      .nav-link.active {
        background-color: #46775c;
        font-weight: bold;
      }
      .submenu {
        background-color: #3b624d;
      }
      .submenu a {
        padding-left: 2.5rem;
        font-size: 0.95rem;
      }
      .has-submenu::after {
        content: "\25BC";
        font-size: 0.75rem;
        margin-left: 0.5rem;
      }

      /* 햄버거 메뉴 (모바일) */
      .hamburger {
        display: none;
        cursor: pointer;
        font-size: 1.25rem;
      }

      /* 반응형 대응 */
      @media (max-width: 768px) {
        .sidebar {
          left: -240px;
          transition: left 0.3s ease;
        }
        .sidebar.show {
          left: 0;
        }
        .main-content {
          margin-left: 0;
        }
        .hamburger {
          display: inline-block;
          margin-right: 1rem;
        }
        .header-right {
          display: none;
        }
        .sidebar-user-info {
          display: block;
        }
      }
    </style>
</head>
<body>
    <header class="header d-flex" th:fragment="e_header">
      <div class="header-left">
        <span class="hamburger" id="hamburger">&#9776;</span> CMS 교직원 포털
      </div>
      <div class="header-center">
        <img
          src="/images/logo-white.png"
          alt="logo"
          height="30"
          class="me-2"
        />
        대한대학교
      </div>
      <div class="header-right" id="user-info">
        <div id="user-logged-in" class="user-box">
          <div class="user-info">
            <div><strong>김교직</strong> (STAFF001)</div>
            <div class="small">학사운영팀</div>
          </div>
          <button class="user-btn" title="로그아웃">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
        <div id="user-logged-out" class="user-box">
          <button class="user-btn" title="로그인">
            <i class="bi bi-box-arrow-in-right"></i> 로그인
          </button>
        </div>
      </div>
    </header>
    
    <aside class="sidebar" id="sidebar" th:fragment="e_sidebar">
      <div class="sidebar-user-info">
        <div><strong>김교직</strong> (STAFF001)</div>
        <div>학사운영팀</div>
        <div class="mt-2">
          <button class="user-btn" title="로그아웃">
            <i class="bi bi-box-arrow-right"></i> 로그아웃
          </button>
        </div>
      </div>
      <nav class="nav flex-column">
        <a class="nav-link has-submenu" href="#" data-menu="상담">상담관리</a>
        <div class="submenu" id="submenu-상담" style="display: block">
          <a class="nav-link" href="/counseling/schedule">상담사일정등록</a>
          <a class="nav-link" href="/counseling/reservations">상담예약관리</a>
          <a class="nav-link active" href="/counseling/results">상담결과관리</a>
        </div>
        </nav>
    </aside>

    <main class="main-content">
        <div class="content-header">
            <h1><i class="fas fa-file-signature"></i> 상담 결과 관리</h1>
            <p>예약이 확정된 상담의 결과를 작성하거나, 완료된 상담의 결과를 수정할 수 있습니다.</p>
        </div>

        <div class="filter-section card-ui">
            <div class="history-filters">
                <div class="filter-group">
                    <label>기간:</label>
                    <select class="filter-select" id="resultsDateFilter">
                        <option value="all">전체 기간</option>
                        <option value="week">최근 1주일</option>
                        <option value="month">최근 1개월</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>상담 유형:</label>
                    <select class="filter-select" id="resultsTypeFilter">
                        <option value="all">전체 유형</option>
                        <option value="진로 상담">진로 상담</option>
                        <option value="학업 상담">학업 상담</option>
                        <option value="심리 상담">심리 상담</option>
                        <option value="취업 상담">취업 상담</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="results-list mt-4">
            </div>
        
        <div class="pagination-container mt-4">
        </div>
    </main>

    <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="resultModalTitle">상담 결과 관리</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="resultForm">
                        <input type="hidden" id="resultId">
                        <input type="hidden" id="resultApplyId">
                        
                        <div class="form-group">
                            <label for="resultContent" class="form-label">상담 내용 및 결과</label>
                            <textarea id="resultContent" class="form-control" rows="12" placeholder="상담 내용을 요약하고, 결과를 입력해주세요..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" onclick="saveResult()">결과 저장</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/employee/counselor-results.js}"></script>

</body>
</html>
