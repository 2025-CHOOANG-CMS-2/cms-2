        <!-- Page Header -->
        <div class="page-header">
            <div class="container">
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb text-white-50">
                        <li class="breadcrumb-item"><a href="index.html" class="text-white-50">홈</a></li>
                        <li class="breadcrumb-item active text-white">공지사항</li>
                    </ol>
                </nav>
                <h1 class="mb-0"><i class="bi bi-megaphone me-2"></i>공지사항</h1>
                <p class="mb-0 mt-2">중요한 소식과 안내사항을 확인하세요</p>
            </div>
        </div>

        <div class="container">
            <!-- Statistics Section -->
            <div class="stats-section">
                <div class="row">
                    <div class="col-md-3">
                        <div class="stat-item">
                            <div class="stat-number" id="totalNoticesCountDisplay">0</div>
                            <div class="stat-label">전체 공지</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-item">
                            <div class="stat-number text-danger" id="importantNoticesCountDisplay">0</div>
                            <div class="stat-label">중요 공지</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-item">
                            <div class="stat-number text-warning" id="activeNoticesCountDisplay">0</div> <!-- 활성 공지로 매핑 -->
                            <div class="stat-label">활성 공지</div> <!-- 긴급 공지 대신 활성 공지로 변경 -->
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-item">
                            <div class="stat-number text-success" id="recent30DaysNewPostsDisplay">0</div> <!-- 이번 주 신규 대신 최근 30일 신규로 매핑 -->
                            <div class="stat-label">최근 30일 신규</div> <!-- 이번 주 신규 대신 최근 30일 신규로 변경 -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Search and Filter Section -->
            <div class="search-filter-section">
                <div class="row g-3 align-items-end">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">검색</label>
                        <div class="search-box">
                            <i class="bi bi-search search-icon"></i>
                            <input type="text" class="form-control search-input" id="searchInput" 
                                   placeholder="제목, 내용으로 검색하세요...">
                        </div>
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label fw-bold">정렬</label>
                        <select class="form-select" id="sortSelect">
                            <option value="createdAt,desc">최신순</option>
                            <option value="createdAt,asc">오래된순</option>
                            <option value="viewCount,desc">조회수순</option>
                            <option value="title,asc">제목순</option>
                        </select>
                    </div>
                    
                    <div class="col-md-3">
                        <label class="form-label fw-bold">표시 개수</label>
                        <select class="form-select" id="itemsPerPage">
                            <option value="10">10개씩</option>
                            <option value="20" selected>20개씩</option>
                            <option value="50">50개씩</option>
                        </select>
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label fw-bold">카테고리</label>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-category-id="all">
                            <i class="bi bi-grid me-1"></i>전체
                        </button>
                        <button class="filter-btn" data-category-id="1"> <!-- 학사공지 ID -->
                            <i class="bi bi-book me-1"></i>학사공지
                        </button>
                        <button class="filter-btn" data-category-id="2"> <!-- 장학공지 ID -->
                            <i class="bi bi-award me-1"></i>장학공지
                        </button>
                        <button class="filter-btn" data-category-id="3"> <!-- 취업공지 ID -->
                            <i class="bi bi-briefcase me-1"></i>취업공지
                        </button>
                        <button class="filter-btn" data-category-id="4"> <!-- 행사공지 ID -->
                            <i class="bi bi-calendar-event me-1"></i>행사공지
                        </button>
                        <button class="filter-btn" data-category-id="5"> <!-- 일반공지 ID -->
                            <i class="bi bi-info-circle me-1"></i>일반공지
                        </button>
                        <button class="filter-btn" data-category-id="important"> <!-- 중요 공지 필터 -->
                            <i class="bi bi-exclamation-triangle me-1"></i>중요 공지
                        </button>
                    </div>
                </div>
                <div class="text-end mt-3">
                    <button class="btn btn-outline-primary" id="applyFilterBtn">
                        <i class="bi bi-funnel me-1"></i>필터 적용
                    </button>
                    <button class="btn btn-outline-secondary" id="resetFilterBtn">
                        <i class="bi bi-arrow-counterclockwise me-1"></i>필터 초기화
                    </button>
                </div>
            </div>

            <!-- Notice List Table -->
            <div class="notice-table-section">
                <h5 class="mb-3">
                    <i class="bi bi-list-ul me-2"></i>
                    공지사항
                </h5>
                <div class="table-responsive">
                    <table class="table table-hover notice-table">
                        <thead>
                            <tr>
                                <th width="8%">번호</th>
                                <th width="40%">제목</th>
                                <th width="12%">카테고리</th>
                                <th width="8%">조회수</th>
                                <th width="15%">작성부서</th>
                                <th width="17%">작성일</th>
                            </tr>
                        </thead>
                        <tbody id="noticeList">
                            <!-- 공지사항 데이터가 여기에 동적으로 로드됩니다 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="pagination-custom" id="paginationContainer">
                <!-- 페이지네이션 버튼들이 여기에 동적으로 생성됩니다 -->
            </div>
        </div>
    </div>

    <!-- Notice Detail Modal -->
    <div class="modal fade notice-detail-modal" id="noticeDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="notice-detail-header">
                    <div class="d-flex justify-content-between align-items-start">
                        <div class="flex-grow-1">
                            <h4 class="mb-2" id="modalTitle">공지사항 제목</h4>
                            <div class="d-flex align-items-center gap-3 text-white-50">
                                <span><i class="bi bi-person me-1"></i><span id="modalAuthor">작성자</span></span>
                                <span><i class="bi bi-calendar me-1"></i><span id="modalDate">작성일</span></span>
                                <span><i class="bi bi-eye me-1"></i><span id="modalViews">조회수</span></span>
                            </div>
                        </div>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                </div>
                <div class="notice-detail-body">
                    <div class="mb-4">
                        <span class="category-badge" id="modalCategory">카테고리</span>
                    </div>
                    
                    <div class="notice-detail-content" id="modalContent">
                        <!-- 공지사항 내용이 여기에 표시됩니다 -->
                    </div>

                    <div class="mt-4" id="attachmentSection" style="display: none;">
                        <h6 class="mb-3">
                            <i class="bi bi-paperclip me-2"></i>첨부파일
                        </h6>
                        <div id="attachmentList">
                            <!-- 첨부파일 목록이 여기에 표시됩니다 -->
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

   <script src="/js/notice/student-notice.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
