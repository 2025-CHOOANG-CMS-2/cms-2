<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상담 조회/결과 - 대한대학교 CMS 포털</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/counsel.css}" rel="stylesheet">

    <style>
        body { background-color: #f0f2f5; margin: 0; padding: 0; font-family: "Segoe UI", sans-serif; }
        .header { position: fixed; top: 0; width: 100%; height: 60px; background-color: #1a2a45; color: white; z-index: 1040; display: flex; align-items: center; padding: 0 1rem; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .header-left { flex: 1; font-weight: bold; }
        .header-center { flex: 1; text-align: center; }
        .header-right { flex: 1; display: flex; justify-content: flex-end; align-items: center; }
        .sidebar { position: fixed; top: 60px; left: 0; width: 240px; height: 100%; background-color: #1a2a45; padding: 1rem 0; color: white; z-index: 1030; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.1); border-radius: 0 !important; overflow-x: hidden !important; }
        .main-content { margin-top: 60px; margin-left: 240px; padding: 2rem; }
        .nav-link { color: #e0e8f0; padding: 0.75rem 1.5rem; display: flex; justify-content: space-between; align-items: center; text-decoration: none; }
        .nav-link:hover { background-color: #223a5e; color: #ffffff; }
        .nav-link.active { background-color: #4a6fdc; font-weight: bold; }
        .submenu { background-color: #223a5e; }
        .submenu a { padding-left: 2.5rem; }
        .has-submenu::after { content: "\25BC"; font-size: 0.75rem; margin-left: 0.5rem; }
        @media (max-width: 768px) { .main-content { margin-left: 0; } }
        
        /* 만족도 평가 별점 스타일 */
        .star-rating .fa-star {
            color: #e2e8f0; /* 비활성 별 (회색) */
            cursor: pointer;
            padding: 0 0.25rem;
            transition: color 0.2s ease-in-out, transform 0.2s ease-in-out;
	    }
	    .star-rating:hover .fa-star {
	        color: #f6e05e; /* 호버 시 전체 별 노란색 */
	    }
	    .star-rating .fa-star:hover ~ .fa-star {
	        color: #e2e8f0; /* 호버된 별 뒤쪽은 다시 회색으로 */
	    }
	    .star-rating .fa-star.selected,
	    .star-rating .fa-star.readonly {
	        color: #f6e05e; /* 선택된 별 */
	    }
	    .star-rating.readonly .fa-star {
	        cursor: default;
	    }
    </style>
</head>
<body>
    <header class="header d-flex">
        <div class="header-left">
            <span class="hamburger" id="hamburger">&#9776;</span> CMS 학생포털
        </div>
        <div class="header-center">
            <img th:src="@{/images/logo-white.png}" alt="logo" height="30" class="me-2" /> 대한대학교
        </div>
        <div class="header-right" id="user-info">
        </div>
    </header>

    <aside class="sidebar" id="sidebar">
        <nav class="nav flex-column">
            <a class="nav-link" href="/notice">공지사항</a>
            <a class="nav-link has-submenu" href="#" data-menu="역량">핵심역량개발</a>
            <div class="submenu" id="submenu-역량" style="display: none"></div>
            <a class="nav-link has-submenu" href="#" data-menu="비교과">비교과프로그램</a>
            <div class="submenu" id="submenu-비교과" style="display: none"></div>
            <a class="nav-link has-submenu" href="#" data-menu="상담">상담센터</a>
            <div class="submenu" id="submenu-상담" style="display: block">
                <a class="nav-link" href="/counseling/reservation">상담 예약</a>
                <a class="nav-link active" href="/counseling/applications">상담 조회/결과</a>
            </div>
            <a class="nav-link" href="/mileage">마일리지</a>
            <a class="nav-link" href="/mypage">마이페이지</a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="content-header">
            <h1><i class="fas fa-history"></i> 상담 조회/결과</h1>
        </div>

        <div class="tab-navigation">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="appointments"><i class="fas fa-calendar-check"></i> 예약 현황</button>
                <button class="tab-btn" data-tab="results"><i class="fas fa-file-medical-alt"></i> 상담 결과</button>
            </div>
        </div>

        <div class="tab-content active" id="appointments">
            <div class="filter-section">
                <div class="history-filters">
                    <div class="filter-group">
                        <label>기간:</label>
                        <select class="filter-select" id="periodFilter">
                            <option value="all">전체</option>
                            <option value="week">최근 1주일</option>
                            <option value="month">최근 1개월</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>상태:</label>
                        <select class="filter-select" id="statusFilter">
                            <option value="all">전체</option>
                            <option value="PENDING">승인대기</option>
                            <option value="APPROVED">예약됨</option>
                            <option value="CANCELED">예약취소</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>상담 유형:</label>
                        <select class="filter-select" id="typeFilter">
                            <option value="all">전체</option>
                            <option value="진로 상담">진로 상담</option>
                            <option value="학업 상담">학업 상담</option>
                            <option value="심리 상담">심리 상담</option>
                            <option value="취업 상담">취업 상담</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="history-list"></div>
            <div class="pagination-container"></div>
        </div>

        <div class="tab-content" id="results">
            <div class="filter-section">
                <div class="history-filters">
                    <div class="filter-group">
                        <label>기간:</label>
                        <select class="filter-select" id="resultsPeriodFilter">
                            <option value="all">전체</option>
                            <option value="week">최근 1주일</option>
                            <option value="month">최근 1개월</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>상담 유형:</label>
                        <select class="filter-select" id="resultsTypeFilter">
                            <option value="all">전체</option>
                            <option value="진로 상담">진로 상담</option>
                            <option value="학업 상담">학업 상담</option>
                            <option value="심리 상담">심리 상담</option>
                            <option value="취업 상담">취업 상담</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="history-list"></div>
            <div class="pagination-container"></div>
        </div>
    </main>

    <!-- [수정] 중복된 모달을 제거하고, 올바른 버전 하나만 남깁니다. -->
    <div class="modal fade" id="resultDetailModal" tabindex="-1" aria-labelledby="resultDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="resultDetailModalLabel"><i class="fas fa-clipboard-check"></i> 상담 결과 상세</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- 로딩 스피너 -->
                    <div id="modal-loading" class="text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
    
                    <!-- 모달 콘텐츠 영역 -->
                    <div id="modal-content-area" style="display: none;">
                        <div class="row mb-3">
                            <div class="col-md-6"><strong><i class="fas fa-user-md"></i> 상담사:</strong> <span id="modal-counselorName"></span></div>
                            <div class="col-md-6"><strong><i class="fas fa-calendar-alt"></i> 상담일:</strong> <span id="modal-counselDate"></span></div>
                        </div>
                        <div class="mb-3"><strong><i class="fas fa-tag"></i> 상담 유형:</strong> <span id="modal-counselingType"></span></div>
                        <hr>
                        <div class="counsel-content-box mt-3">
                            <h6 class="font-weight-bold"><i class="fas fa-commenting"></i> 상담 내용:</h6>
                            <p id="modal-counselingContent" class="p-3 bg-light rounded" style="white-space: pre-wrap; min-height: 100px;"></p>
                        </div>
    
                        <!-- 만족도 평가 섹션 -->
                        <div id="satisfaction-section" class="mt-4 pt-4 border-top" style="display: none;">
                            <h5 class="font-weight-bold text-center mb-3">상담은 만족스러우셨나요?</h5>
                            <!-- 별점 입력 영역 -->
                            <div id="rating-input-area">
                                <div class="star-rating d-flex justify-content-center h4">
                                    <i class="fas fa-star" data-value="1"></i>
                                    <i class="fas fa-star" data-value="2"></i>
                                    <i class="fas fa-star" data-value="3"></i>
                                    <i class="fas fa-star" data-value="4"></i>
                                    <i class="fas fa-star" data-value="5"></i>
                                </div>
                                <div class="text-end mt-3">
                                    <button id="save-rating-btn" class="btn btn-primary"><i class="fas fa-save"></i> 평점 제출</button>
                                </div>
                            </div>
                            <!-- 평점 제출 후 표시 영역 -->
                            <div id="rating-display-area" style="display: none;">
                                <p class="text-center text-muted">소중한 피드백 감사합니다!</p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/student/counsel-history.js}"></script>
</body>
</html>
