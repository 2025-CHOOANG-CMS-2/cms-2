<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>상담 예약 - 대한대학교 CMS 포털</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <link th:href="@{/css/counsel.css}" rel="stylesheet" />

  <th:block th:replace="s_header :: head"></th:block>
  </head>
  
  <body>
	<th:block th:replace="s_header :: header"></th:block>
    <th:block th:replace="s_header :: sidebar"></th:block>
    
    <main class="main-content">
      <div class="content-header">
        <h1>상담 예약</h1>
        <div class="breadcrumb">
          <i class="fas fa-home"></i> 홈 &gt; 상담센터 &gt; 상담 예약
        </div>
      </div>
      
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card-ui">
             <div class="calendar-container">
              <h3><i class="fas fa-calendar-alt"></i> 예약 날짜 선택</h3>
              <div class="calendar-header">
                <button class="calendar-nav" id="prevMonth"><i class="fas fa-chevron-left"></i></button>
                <h4 id="currentMonth">2025년 6월</h4>
                <button class="calendar-nav" id="nextMonth"><i class="fas fa-chevron-right"></i></button>
              </div>
              <div class="calendar-weekdays">
				  <div>일</div>
				  <div>월</div>
				  <div>화</div>
				  <div>수</div>
				  <div>목</div>
				  <div>금</div>
				  <div>토</div>
			  </div>
              <div class="calendar-grid" id="calendarGrid"></div>
              <h4 style="margin-top:20px; margin-bottom:15px;"><i class="fas fa-clock"></i> 예약 시간 선택</h4>
              <div class="time-slots" id="timeSlots">
                <div class="time-slot" data-time="09:00">09:00</div>
                <div class="time-slot" data-time="10:00">10:00</div>
                <div class="time-slot" data-time="11:00">11:00</div>
                <div class="time-slot" data-time="13:00">13:00</div>
                </div>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card-ui">
            <div class="booking-form">
              <h3><i class="fas fa-edit"></i> 예약 정보 입력</h3>
              <form id="bookingForm">
                 <div class="form-group">
                  <label class="form-label">상담 유형</label>
                  <select class="form-control" name="counselingType" required>
                    <option value="">선택해주세요</option>
                    </select>
                </div>
                <div class="form-group">
                  <label class="form-label">상담 방식</label>
                  <select class="form-control" name="counselingMethod" required>
                    <option value="">선택해주세요</option>
                    </select>
                </div>
                <div class="form-group">
                  <label class="form-label">상담 내용</label>
                  <textarea class="form-control" name="content" rows="4" placeholder="상담받고 싶은 내용을 자세히 작성해주세요" required></textarea>
                </div>
                <div class="form-group">
                  <label class="form-label">연락처</label>
                  <input type="tel" class="form-control" name="phone" placeholder="010-0000-0000" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3"><i class="fas fa-calendar-check"></i> 상담 예약하기</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <div class="notification" id="notification"></div>
    
    <th:block th:replace="s_header :: scripts"></th:block>
    <script th:src="@{/js/student/counsel-book.js}"></script>
  </body>
</html>
