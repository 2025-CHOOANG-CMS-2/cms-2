<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>대한대학교 CMS 포털</title>
    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      /* 공통 스타일 */
      body {
        background-color: #fafafa;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", sans-serif;
      }

      /* 헤더 영역 */
      .header {
        position: fixed;
        top: 0;
        width: 100%;
        height: 60px;
        background-color: #1a2a45;
        color: white;
        z-index: 1040;
        display: flex;
        align-items: center;
        padding: 0 1rem;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      .header-left {
        flex: 1;
        font-weight: bold;
        font-size: 1.1rem;
      }
      .header-center {
        flex: 1;
        text-align: center;
        font-size: 1.2rem;
      }
      .header-right {
        flex: 1;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        font-size: 0.9rem;
        gap: 1rem;
      }

      /* 사용자 정보 및 버튼 */
      .user-box {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .user-info {
        text-align: right;
        line-height: 1.2;
      }
      .user-btn {
        background: none;
        border: none;
        color: white;
        font-size: 1.2rem;
        padding: 0.25rem 0.5rem;
        cursor: pointer;
      }
      .user-btn:hover {
        color: #ffc107;
      }

      /* 사이드바 */
      .sidebar {
        position: fixed;
        top: 60px;
        left: 0;
        width: 240px;
        height: 100%;
        background-color: #1a2a45;
        padding: 1rem 0;
        color: white;
        z-index: 1030;
        overflow-y: auto;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
      }
      .sidebar-user-info {
        display: none;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .sidebar-user-info div {
        font-size: 0.95rem;
        line-height: 1.4;
      }

      /* 본문 */
      .main-content {
        margin-top: 60px;
        margin-left: 240px;
        padding: 1.5rem;
      }

      /* 메뉴 스타일 */
      .nav-link {
        color: #e0e8f0;
        padding: 0.75rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        transition: background-color 0.2s, color 0.2s;
        text-decoration: none;
      }
      .nav-link:hover {
        background-color: #223a5e;
        color: #ffffff;
      }
      .nav-link.active {
        background-color: #2b4d77;
        font-weight: bold;
      }
      .submenu {
        background-color: #223a5e;
      }
      .submenu a {
        padding-left: 2.5rem;
        font-size: 0.95rem;
      }
      .has-submenu::after {
        content: "\25BC";
        font-size: 0.75rem;
        margin-left: 0.5rem;
      }

      /* 햄버거 메뉴 (모바일) */
      .hamburger {
        display: none;
        cursor: pointer;
        font-size: 1.25rem;
      }

      /* 반응형 대응 */
      @media (max-width: 768px) {
        .sidebar {
          left: -240px;
          transition: left 0.3s ease;
        }
        .sidebar.show {
          left: 0;
        }
        .main-content {
          margin-left: 0;
        }
        .hamburger {
          display: inline-block;
          margin-right: 1rem;
        }
        .header-right {
          display: none;
        }
        .sidebar-user-info {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <!-- 상단 헤더 -->
    <th:block th:fragment="header">
    <header class="header d-flex">
      <div class="header-left">
        <span class="hamburger" id="hamburger">&#9776;</span> CMS 학생포털
      </div>
      <div class="header-center">
        <img
          th:src="@{/images/logo-white.png}"
          alt="logo"
          height="30"
          class="me-2"
        />
        대한대학교
      </div>
      <div class="header-right" id="user-info">
        <!-- 로그인 상태 -->
        <div id="user-logged-in" class="user-box">
          <div class="user-info">
            <div><strong>홍길동</strong> (20231234)</div>
            <div class="small">컴퓨터공학과 3학년</div>
          </div>
          <button class="user-btn" title="로그아웃">
            <i class="bi bi-box-arrow-right"></i>
          </button>
        </div>
        <!-- 비로그인 상태 -->
        <div id="user-logged-out" class="user-box">
          <button class="user-btn" title="로그인">
            <i class="bi bi-box-arrow-in-right"></i> 로그인
          </button>
        </div>
      </div>
    </header>
	</th:block>
	
    <!-- 좌측 사이드바 -->
    <th:block th:fragment="sidebar">
    <aside class="sidebar" id="sidebar">
      <!-- 모바일에서 사용자 정보 표시 -->
      <div class="sidebar-user-info">
        <div><strong>홍길동</strong> (20231234)</div>
        <div>컴퓨터공학과 3학년</div>
        <div class="mt-2">
          <button class="user-btn" title="로그아웃">
            <i class="bi bi-box-arrow-right"></i> 로그아웃
          </button>
        </div>
      </div>
      <!-- 메뉴 항목 -->
      <nav class="nav flex-column">
        <a class="nav-link" href="/notice">공지사항</a>
        <a class="nav-link has-submenu" href="/competency" data-menu="역량"
          >핵심역량개발</a
        >
        <div class="submenu" id="submenu-역량" style="display: none">
          <a class="nav-link" href="/competency/test">진단검사</a>
          <a class="nav-link" href="/competency/history">진단결과이력</a>
        </div>
        <a class="nav-link has-submenu" href="/program" data-menu="비교과"
          >비교과프로그램</a
        >
        <div class="submenu" id="submenu-비교과" style="display: none">
          <a class="nav-link" href="/program/list">프로그램 목록</a>
          <a class="nav-link" href="/program/status">프로그램 참여 현황</a>
        </div>
        <a class="nav-link has-submenu" href="/counseling" data-menu="상담"
          >상담센터</a
        >
        <div class="submenu" id="submenu-상담" style="display: none">
          <a class="nav-link" href="/counseling/reservation">상담 예약</a>
          <a class="nav-link" href="/counseling/applications">상담 신청 내역</a>
          <a class="nav-link" href="/counseling/results">상담결과</a>
        </div>
        <a class="nav-link" href="/mileage">마일리지</a>
        <a class="nav-link" href="/mypage">마이페이지</a>
      </nav>
    </aside>
	</th:block>
	
    <!-- 본문 영역 -->
    <main class="main-content">
      <h1>메인 콘텐츠 영역</h1>
      <p>각 메뉴 클릭 시 이 영역에 해당 내용이 로드됩니다.</p>
    </main>

    <!-- 인터랙션 스크립트 -->
    <th:block th:fragment="scripts">
    <script>
      const sidebar = document.getElementById("sidebar");
      const hamburger = document.getElementById("hamburger");
      hamburger.addEventListener("click", () => {
        sidebar.classList.toggle("show");
      });

      const menuLinks = document.querySelectorAll("[data-menu]");
      menuLinks.forEach((menu) => {
        menu.addEventListener("click", (e) => {
          e.preventDefault();
          const key = menu.getAttribute("data-menu");
          const submenu = document.getElementById(`submenu-${key}`);

          document.querySelectorAll(".submenu").forEach((sm) => {
            if (sm !== submenu) sm.style.display = "none";
          });

          if (submenu) {
            submenu.style.display =
              submenu.style.display === "block" ? "none" : "block";
          }
        });
      });
    </script>
    </th:block>
  </body>
</html>
