    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch("/api/user/me/employee", {
                    headers: {
                        "Authorization": `Bearer ${localStorage.getItem("accessToken")}`
                    }
                });

                if (!res.ok) throw new Error("교직원 인증 실패");

                const data = await res.json();

                // ✅ 사용자 정보 출력
                const box = document.getElementById("empl-info");
                if (box) {
                    box.innerHTML = `
                    <div><strong>${data.emplNm}</strong> (${data.userId})</div>
                    <div>${data.deptCd}</div>
                    <div class="mt-2">
                        <button class="user-btn" title="로그아웃" onclick="logout()">
                            <i class="bi bi-box-arrow-right"></i> 로그아웃
                        </button>
                    </div>
                `;
                }

                // ✅ ADMIN 권한이 있을 경우 관리자 메뉴 보이기
                const roles = data.roles || [];

                if (roles.includes("ADMIN")) {
                    const studentMenu = document.getElementById("admin-student");
                    const employeeMenu = document.getElementById("admin-employee");
                    if (studentMenu) studentMenu.style.display = "block";
                    if (employeeMenu) employeeMenu.style.display = "block";
                }

            } catch (err) {
                console.warn("❌ 교직원 정보 가져오기 실패:", err);
            }
        });

        // 로그아웃 버튼 처리
        function logout() {
            fetch("/api/auth/logout", { method: "POST" })
                .then(() => location.href = "/login")
                .catch(err => {
                    alert("로그아웃 실패");
                    console.error(err);
                });
        }
    </script>
