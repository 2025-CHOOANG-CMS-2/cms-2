    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const token = localStorage.getItem("accessToken");
            //if (!token) return;

            try {
                const res = await fetch("/api/user/me/student", {
                    headers: {
                        "Authorization": `Bearer ${token}`
                    }
                });

                if (!res.ok) throw new Error("학생 인증 실패");

                const data = await res.json();
               // console.log("sidebar data 확인 "+data.userId);
                // ✅ 마이페이지 링크에 클릭 이벤트 추가
                const link = document.getElementById("mypage-link");
                if (link) {
                    link.addEventListener("click", function (e) {
                        e.preventDefault(); // 기존 a 태그 동작 막기
                        window.location.href = `/students/mypage?studentId=${data.userId}`; // 직접 이동
                    });
                }
            } catch (err) {
                console.warn("학생 정보 가져오기 실패", err);
            }
        });
    </script>
