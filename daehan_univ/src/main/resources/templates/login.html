<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 교육 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/login.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="login-container">
            <div class="row g-0 h-100">
                <!-- Left Side - Branding -->
                <div class="col-lg-5 d-none d-lg-flex">
                    <div class="login-left">
                        <div class="logo">
                            <i class="bi bi-mortarboard-fill"></i>
                        </div>
                        <h2 class="mb-3">교육 관리 시스템</h2>
                        <p class="mb-4">학생들의 성장과 발전을 위한<br>통합 교육 관리 플랫폼</p>
                        <div class="features">
                            <div class="feature-item mb-3">
                                <i class="bi bi-check-circle me-2"></i>
                                핵심역량진단 및 분석
                            </div>
                            <div class="feature-item mb-3">
                                <i class="bi bi-check-circle me-2"></i>
                                비교과 프로그램 관리
                            </div>
                            <div class="feature-item mb-3">
                                <i class="bi bi-check-circle me-2"></i>
                                개인별 상담 및 지도
                            </div>
                            <div class="feature-item">
                                <i class="bi bi-check-circle me-2"></i>
                                마일리지 적립 시스템
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Side - Login Form -->
                <div class="col-lg-7">
                    <div class="login-right">
                        <div class="text-center mb-4 d-lg-none">
                            <i class="bi bi-mortarboard-fill" style="font-size: 3rem; color: var(--secondary-color);"></i>
                            <h3 class="mt-2">교육 관리 시스템</h3>
                        </div>

                        <h2 class="login-title">로그인</h2>

                        <!-- Alert Messages -->
                        <div id="alertContainer"></div>

                        <!-- User Type Selection -->
                        <div class="user-type-selector">
                            <label class="form-label fw-bold">사용자 유형</label>
                            <div class="d-flex flex-wrap">
                                <div class="user-type-btn active" data-type="student">
                                    <i class="bi bi-person"></i>
                                    <div>학생</div>
                                </div>
                                <div class="user-type-btn" data-type="faculty">
                                    <i class="bi bi-person-badge"></i>
                                    <div>교직원</div>
                                </div>
                                <div class="user-type-btn" data-type="admin">
                                    <i class="bi bi-shield-check"></i>
                                    <div>관리자</div>
                                </div>
                            </div>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">
                            <div class="form-floating">
                                <input type="text" class="form-control" id="username" placeholder="아이디" required>
                                <label for="username">
                                    <i class="bi bi-person me-2"></i>아이디
                                </label>
                            </div>

                            <div class="form-floating">
                                <input type="password" class="form-control" id="password" placeholder="비밀번호" required>
                                <label for="password">
                                    <i class="bi bi-lock me-2"></i>비밀번호
                                </label>
                            </div>

                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    로그인 상태 유지
                                </label>
                            </div>

                            <button type="submit" class="login-btn" id="loginBtn">
                                <span class="loading-spinner">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </span>
                                <span class="btn-text">로그인</span>
                            </button>
                        </form>

                        <div class="forgot-password">
                            <a href="#" onclick="showForgotPassword()">비밀번호를 잊으셨나요?</a>
                        </div>

                        <!-- Demo Accounts -->
                        <div class="demo-accounts">
                            <h6 class="mb-3">
                                <i class="bi bi-info-circle me-2"></i>
                                데모 계정 (클릭하여 자동 입력)
                            </h6>
                            
                            <div class="demo-account" onclick="fillDemoAccount('student', 'student123', 'password123')">
                                <div>
                                    <strong>학생 계정</strong>
                                    <br><small class="text-muted">ID: student123</small>
                                </div>
                                <i class="bi bi-person text-primary"></i>
                            </div>
                            
                            <div class="demo-account" onclick="fillDemoAccount('faculty', 'faculty123', 'password123')">
                                <div>
                                    <strong>교직원 계정</strong>
                                    <br><small class="text-muted">ID: faculty123</small>
                                </div>
                                <i class="bi bi-person-badge text-success"></i>
                            </div>
                            
                            <div class="demo-account" onclick="fillDemoAccount('admin', 'admin123', 'password123')">
                                <div>
                                    <strong>관리자 계정</strong>
                                    <br><small class="text-muted">ID: admin123</small>
                                </div>
                                <i class="bi bi-shield-check text-danger"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        /**
         * ✅ 로그인 폼 submit 이벤트 등록
         * - 사용자가 로그인 버튼을 클릭하면 이 이벤트가 실행됩니다.
         * - 서버에 POST /api/auth/login 요청 → 서버가 쿠키에 JWT 설정 → 리다이렉트
         */
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();  // 🔹 기본 form 제출(새로고침) 방지

            // 🔹 사용자 입력 값 읽기
            const username = document.getElementById('username').value;    // 사용자 ID 입력값
            const password = document.getElementById('password').value;    // 사용자 비밀번호 입력값
            const rememberMe = document.getElementById('rememberMe').checked;  // 로그인 상태 유지 여부

            // 🔹 로딩 상태 UI 표시 (버튼 비활성화 + 스피너 출력)
            showLoading(true);

            // 🔹 서버에 로그인 요청 (POST /api/auth/login)
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'  // 요청 본문 형식은 JSON
                },
                body: JSON.stringify({
                    userId: username,
                    password: password
                })
            })
                .then(res => {
                    if (!res.ok) {
                        // 서버 응답이 2xx가 아니면 예외 처리 (ex: 401, 403, 500)
                        throw new Error('로그인 실패: ' + res.status);
                    }
                    return res.json();  // 응답 JSON 파싱 (redirectUrl 포함)
                })
                .then(data => {
                    // 🔹 서버에서 리다이렉트 URL 수신 (권한 기반 페이지 경로)
                    const redirectUrl = data.redirectUrl;

                    // 🔹 rememberMe가 체크되었으면 사용자 ID 저장
                    if (rememberMe) {
                        localStorage.setItem('rememberedUser', username);
                    } else {
                        localStorage.removeItem('rememberedUser');
                    }

                    // 🔹 성공 메시지 출력
                    showAlert('success', '로그인 성공! 페이지 이동 중입니다...');

                    // 🔹 1초 후 리다이렉트 (쿠키 기반 인증 → 서버가 권한 체크)
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 1000);
                })
                .catch(err => {
                    // 🔹 로그인 실패 처리
                    console.error(err);
                    showAlert('danger', '로그인 실패: 아이디 또는 비밀번호를 확인하세요.');
                })
                .finally(() => {
                    // 🔹 로딩 상태 UI 해제
                    showLoading(false);
                });
        });

        /**
         * ✅ showLoading
         * - 로그인 버튼에 로딩 상태를 표시 (스피너 + 버튼 비활성화)
         *
         * @param {boolean} show true = 로딩 중, false = 로딩 해제
         */
        function showLoading(show) {
            const loginBtn = document.getElementById('loginBtn');
            const spinner = loginBtn.querySelector('.loading-spinner');
            const btnText = loginBtn.querySelector('.btn-text');

            if (show) {
                spinner.style.display = 'inline-block';  // 스피너 표시
                btnText.textContent = '로그인 중...';   // 버튼 텍스트 변경
                loginBtn.disabled = true;               // 버튼 비활성화
            } else {
                spinner.style.display = 'none';         // 스피너 숨김
                btnText.textContent = '로그인';         // 버튼 텍스트 복원
                loginBtn.disabled = false;              // 버튼 활성화
            }
        }

        /**
         * ✅ showAlert
         * - Bootstrap alert을 통해 사용자에게 메시지 표시
         *
         * @param {string} type success | danger
         * @param {string} message 사용자에게 보여줄 메시지
         */
        function showAlert(type, message) {
            const alertContainer = document.getElementById('alertContainer');
            const alertHtml = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} me-2"></i>
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
            alertContainer.innerHTML = alertHtml;

            // 3초 후 알림 자동 제거
            setTimeout(() => {
                const alert = alertContainer.querySelector('.alert');
                if (alert) {
                    alert.remove();
                }
            }, 3000);
        }

        /**
         * ✅ 페이지 로드 시 rememberMe 적용
         * - 이전에 저장된 사용자 ID를 자동 입력
         */
        window.addEventListener('load', function () {
            const rememberedUser = localStorage.getItem('rememberedUser');
            if (rememberedUser) {
                document.getElementById('username').value = rememberedUser;
                document.getElementById('rememberMe').checked = true;
            }
        });
    </script>


</body>
</html>
