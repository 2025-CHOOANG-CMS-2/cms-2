<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 교육 관리 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --dark-gradient: linear-gradient(135deg, #2d3748 0%, #4a5568 100%);
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.18);
            --shadow-soft: 0 8px 32px rgba(31, 38, 135, 0.37);
            --shadow-hover: 0 15px 35px rgba(31, 38, 135, 0.5);
            --text-primary: #2d3748;
            --text-secondary: #718096;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle><circle cx="80" cy="30" r="1.5" fill="rgba(255,255,255,0.15)"><animate attributeName="opacity" values="1;0;1" dur="4s" repeatCount="indefinite"/></circle><circle cx="40" cy="70" r="1" fill="rgba(255,255,255,0.1)"><animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/></circle></svg>');
            pointer-events: none;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .login-container {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 0;
            box-shadow: none;
            overflow: hidden;
            width: 100%;
            height: 100vh;
            position: relative;
            animation: slideIn 0.8s ease-out;
        }

        .row {
            height: 100vh;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-left {
            background: var(--dark-gradient);
            color: white;
            padding: 60px 40px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .login-left::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            to {
                transform: rotate(360deg);
            }
        }

        .login-left > * {
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 10px 30px rgba(79, 172, 254, 0.3);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 15px 40px rgba(79, 172, 254, 0.5);
            }
        }

        .logo i {
            font-size: 2.5rem;
            color: white;
        }

        .login-left h2 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #fff, #f0f8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-left p {
            font-size: 1.1rem;
            line-height: 1.6;
            opacity: 0.9;
            margin-bottom: 40px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            font-size: 1rem;
            margin-bottom: 20px;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
        }

        .feature-item:nth-child(1) { animation-delay: 0.2s; }
        .feature-item:nth-child(2) { animation-delay: 0.4s; }
        .feature-item:nth-child(3) { animation-delay: 0.6s; }
        .feature-item:nth-child(4) { animation-delay: 0.8s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feature-item i {
            color: #4facfe;
            margin-right: 15px;
            font-size: 1.2rem;
        }

        .login-right {
            padding: 60px 50px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 40px;
            text-align: center;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-floating {
            margin-bottom: 25px;
            position: relative;
        }

        .form-floating input {
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 15px;
            padding: 20px 15px 20px 50px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(5px);
        }

        .form-floating input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-2px);
        }

        .form-floating label {
            color: var(--text-secondary);
            font-weight: 500;
            left: 50px;
            transition: all 0.3s ease;
        }

        .form-floating input:focus + label,
        .form-floating input:not(:placeholder-shown) + label {
            color: #667eea;
            transform: scale(0.85) translateY(-0.5rem) translateX(-0.15rem);
        }

        .form-floating label i {
            position: absolute;
            left: -35px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            color: #667eea;
        }

        .form-check {
            margin-bottom: 30px;
        }

        .form-check-input:checked {
            background-color: #667eea;
            border-color: #667eea;
        }

        .form-check-label {
            color: var(--text-secondary);
            font-weight: 500;
        }

        .login-btn {
            width: 100%;
            padding: 18px;
            background: var(--primary-gradient);
            border: none;
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .login-btn:hover::before {
            left: 100%;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
        }

        .login-btn:active {
            transform: translateY(-1px);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: none;
            margin-right: 10px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .forgot-password {
            text-align: center;
        }

        .forgot-password a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            position: relative;
        }

        .forgot-password a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -2px;
            left: 50%;
            background: var(--primary-gradient);
            transition: all 0.3s ease;
        }

        .forgot-password a:hover::after {
            width: 100%;
            left: 0;
        }

        .forgot-password a:hover {
            color: #764ba2;
        }

        .alert {
            border: none;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            margin-bottom: 20px;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .alert-success {
            background: linear-gradient(135deg, rgba(72, 187, 120, 0.1), rgba(56, 178, 172, 0.1));
            color: #2f855a;
            border-left: 4px solid #48bb78;
        }

        .alert-danger {
            background: linear-gradient(135deg, rgba(245, 101, 101, 0.1), rgba(229, 62, 62, 0.1));
            color: #c53030;
            border-left: 4px solid #f56565;
        }

        /* Mobile responsive */
        @media (max-width: 768px) {
            .container {
                padding: 0;
            }

            .login-container {
                border-radius: 0;
                min-height: 100vh;
                height: 100vh;
            }

            .login-left {
                padding: 40px 30px;
            }

            .login-left h2 {
                font-size: 2rem;
            }

            .login-right {
                padding: 40px 30px;
            }

            .login-title {
                font-size: 2rem;
                margin-bottom: 30px;
            }

            .form-floating input {
                padding: 18px 15px 18px 45px;
            }

            .form-floating label {
                left: 45px;
            }

            .form-floating label i {
                left: -30px;
            }
        }

        /* Mobile-only logo */
        .mobile-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .mobile-logo i {
            font-size: 4rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .mobile-logo h3 {
            color: var(--text-primary);
            font-weight: 700;
            margin-top: 10px;
        }

        /* Floating elements animation */
        .floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="login-container">
        <div class="row g-0 h-100">
            <!-- Left Side - Branding -->
            <div class="col-lg-5 d-none d-lg-flex">
                <div class="login-left">
                    <div class="logo floating">
                        <i class="bi bi-mortarboard-fill"></i>
                    </div>
                    <h2 class="mb-3">대한 대학교<br> 교육 관리 시스템</h2>
                    <p class="mb-4">학생들의 성장과 발전을 위한<br>통합 교육 관리 플랫폼</p>
                    <div class="features">
                        <div class="feature-item">
                            <i class="bi bi-check-circle-fill"></i>
                            핵심역량진단 및 분석
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-check-circle-fill"></i>
                            비교과 프로그램 관리
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-check-circle-fill"></i>
                            개인별 상담 및 지도
                        </div>
                        <div class="feature-item">
                            <i class="bi bi-check-circle-fill"></i>
                            마일리지 적립 시스템
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side - Login Form -->
            <div class="col-lg-7">
                <div class="login-right">
                    <div class="mobile-logo d-lg-none">
                        <i class="bi bi-mortarboard-fill"></i>
                        <h3>교육 관리 시스템</h3>
                    </div>

                    <h2 class="login-title">로그인</h2>

                    <!-- Alert Messages -->
                    <div id="alertContainer"></div>

                    <!-- Login Form -->
                    <form id="loginForm">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="username" placeholder="아이디" required>
                            <label for="username">
                                <i class="bi bi-person-fill"></i>아이디
                            </label>
                        </div>

                        <div class="form-floating">
                            <input type="password" class="form-control" id="password" placeholder="비밀번호" required>
                            <label for="password">
                                <i class="bi bi-lock-fill"></i>비밀번호
                            </label>
                        </div>

                       <!-- <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                로그인 상태 유지
                            </label>
                        </div>-->

                        <button type="submit" class="login-btn" id="loginBtn">
                                <span class="loading-spinner">
                                    <i class="bi bi-arrow-clockwise"></i>
                                </span>
                            <span class="btn-text">로그인</span>
                        </button>
                    </form>
                    <div class="mt-4">
                        <div class="alert alert-info">
                            <h5 class="mb-3">🎓 테스트 계정 안내</h5>
                            <ul class="mb-0">
                                <li><strong>학생</strong> ➤ ID: <code>2025005001</code> / PW: <code>2025005001</code></li>
                                <li><strong>교직원</strong> ➤ ID: <code>2025111001</code> / PW: <code>2025111001</code></li>
                                <li><strong>관리자</strong> ➤ ID: <code>2025111002</code> / PW: <code> #xptmxm1234G</code></li>
                            </ul>
                        </div>
                    </div>
                    <div class="forgot-password">
                        <a href="#" onclick="showForgotPassword()">비밀번호를 잊으셨나요?</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    /**
     * ✅ 로그인 폼 submit 이벤트 등록
     * - 사용자가 로그인 버튼을 클릭하면 이 이벤트가 실행됩니다.
     * - 서버에 POST /api/auth/login 요청 → 서버가 쿠키에 JWT 설정 → 리다이렉트
     */
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();  // 🔹 기본 form 제출(새로고침) 방지

        // 🔹 사용자 입력 값 읽기
        const username = document.getElementById('username').value;    // 사용자 ID 입력값
        const password = document.getElementById('password').value;    // 사용자 비밀번호 입력값
        const rememberMe = document.getElementById('rememberMe').checked;  // 로그인 상태 유지 여부

        // 🔹 로딩 상태 UI 표시 (버튼 비활성화 + 스피너 출력)
        showLoading(true);

        // 🔹 서버에 로그인 요청 (POST /api/auth/login)
        fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'  // 요청 본문 형식은 JSON
            },
            body: JSON.stringify({
                userId: username,
                password: password
            })
        })
            .then(res => {
                if (!res.ok) {
                    // 서버 응답이 2xx가 아니면 예외 처리 (ex: 401, 403, 500)
                    throw new Error('로그인 실패: ' + res.status);
                }
                return res.json();  // 응답 JSON 파싱 (redirectUrl 포함)
            })
            .then(data => {
                // 🔹 서버에서 리다이렉트 URL 수신 (권한 기반 페이지 경로)
                const redirectUrl = data.redirectUrl;

                // 🔹 rememberMe가 체크되었으면 사용자 ID 저장
                if (rememberMe) {
                    localStorage.setItem('rememberedUser', username);
                } else {
                    localStorage.removeItem('rememberedUser');
                }

                // 🔹 성공 메시지 출력
                showAlert('success', '로그인 성공! 페이지 이동 중입니다...');

                // 🔹 1초 후 리다이렉트 (쿠키 기반 인증 → 서버가 권한 체크)
                setTimeout(() => {
                    window.location.href = redirectUrl;
                }, 1000);
            })
            .catch(err => {
                // 🔹 로그인 실패 처리
                console.error(err);
                showAlert('danger', '로그인 실패: 아이디 또는 비밀번호를 확인하세요.');
            })
            .finally(() => {
                // 🔹 로딩 상태 UI 해제
                showLoading(false);
            });
    });

    /**
     * ✅ showLoading
     * - 로그인 버튼에 로딩 상태를 표시 (스피너 + 버튼 비활성화)
     *
     * @param {boolean} show true = 로딩 중, false = 로딩 해제
     */
    function showLoading(show) {
        const loginBtn = document.getElementById('loginBtn');
        const spinner = loginBtn.querySelector('.loading-spinner');
        const btnText = loginBtn.querySelector('.btn-text');

        if (show) {
            spinner.style.display = 'inline-block';  // 스피너 표시
            btnText.textContent = '로그인 중...';   // 버튼 텍스트 변경
            loginBtn.disabled = true;               // 버튼 비활성화
        } else {
            spinner.style.display = 'none';         // 스피너 숨김
            btnText.textContent = '로그인';         // 버튼 텍스트 복원
            loginBtn.disabled = false;              // 버튼 활성화
        }
    }

    /**
     * ✅ showAlert
     * - Bootstrap alert을 통해 사용자에게 메시지 표시
     *
     * @param {string} type success | danger
     * @param {string} message 사용자에게 보여줄 메시지
     */
    function showAlert(type, message) {
        const alertContainer = document.getElementById('alertContainer');
        const alertHtml = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="bi bi-${type === 'success' ? 'check-circle-fill' : 'exclamation-triangle-fill'} me-2"></i>
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
    `;
        alertContainer.innerHTML = alertHtml;

        // 3초 후 알림 자동 제거
        setTimeout(() => {
            const alert = alertContainer.querySelector('.alert');
            if (alert) {
                alert.remove();
            }
        }, 3000);
    }

    /**
     * ✅ 페이지 로드 시 rememberMe 적용
     * - 이전에 저장된 사용자 ID를 자동 입력
     */
    window.addEventListener('load', function () {
        const rememberedUser = localStorage.getItem('rememberedUser');
        if (rememberedUser) {
            document.getElementById('username').value = rememberedUser;
            document.getElementById('rememberMe').checked = true;
        }
    });

    // 비밀번호 찾기 함수 (placeholder)
    function showForgotPassword() {
        alert('비밀번호 찾기 기능은 준비 중입니다.');
    }
</script>
</body>
</html>
